# http://localhost:3420/chats/<id1>
- region "Notifications alt+T"
- dialog "Edit MCP Bot fixed":
    - heading "Edit MCP Bot fixed" [level=2]
    - paragraph: Prompt and model changes apply from the next turn; history is kept.
    - tablist:
        - tab "Profile"
        - tab "Tools" [selected]
        - tab "Skills"
        - tab "Sharing"
    - tabpanel "Tools":
        - searchbox "Search tools"
        - text: 11 allow · 20 ask
        - button "Allow read-only"
        - button "Ask for everything"
        - paragraph:
            - text: Every bot has these tools.
            - strong: Allow
            - text: runs a tool unattended,
            - strong: Ask
            - text: waits for your approval,
            - strong: "Off"
            - text: hides it from this bot.
        - paragraph: Auto-review
        - paragraph: A classifier approves low-risk Ask actions you clearly asked for, so they run without a card. Anything else still asks you, and so do vault use and Ask (always) tools.
        - switch "Auto-review"
        - paragraph: YOLO mode by default
        - paragraph: "Every new chat with this bot starts with YOLO mode on: Ask tools run without a card. Vault use, turns you did not start and routines still ask. You can turn it off in any chat."
        - switch "YOLO mode by default"
        - button "Memory 2 tools · 2 ask" [expanded]
