# http://localhost:3420/connections/<id1>/tools/reset
- complementary "Sidebar":
    - link "tiny-agents":
        - /url: /chats
    - button "Search"
    - button "Collapse sidebar"
    - navigation "Primary":
        - link "Tasks":
            - /url: /tasks
        - link "Terminal":
            - /url: /terminal
        - link "Computer":
            - /url: /computer
        - link "Browser":
            - /url: /browser
    - region "Bots":
        - heading "Bots" [level=2]
        - button "New bot"
        - list:
            - listitem:
                - link "MCP Bot fixed":
                    - /url: /chats/<id2>
                - button "MCP Bot fixed actions"
    - button "Account and navigation": D Demo User
- main:
    - navigation "breadcrumb":
        - list:
            - listitem:
                - link "Connections":
                    - /url: /connections
            - listitem:
                - link "Verify MCP fixed":
                    - /url: /connections/<id1>
            - listitem: reset
    - heading "reset" [level=1]
    - text: mcp__verify-mcp-fixed__reset
    - switch "Available to bots"
    - text: Available to bots
    - alert: Off for every bot No bot sees this tool, whatever its own permissions say. You can still try it in the playground below.
    - paragraph: Reset the counter
    - term: Server name
    - definition: reset
    - term: Connection
    - definition:
        - link "Verify MCP fixed":
            - /url: /connections/<id1>
    - term: Behavior
    - definition: may change data
    - paragraph: Behavior comes from the server's hints. Each bot still decides whether it may run the tool or must ask first.
    - heading "Input" [level=2]
    - paragraph: The arguments the tool accepts.
    - tablist:
        - tab "Fields"
        - tab "JSON Schema" [selected]
    - tabpanel "JSON Schema": '{ "type": "object" }'
    - heading "Output" [level=2]
    - paragraph: The server declares no output schema; results come back as content blocks.
    - heading "Playground" [level=2]
    - paragraph: Call the tool on Verify MCP fixed as yourself. Nothing is sent to a bot.
    - tablist:
        - tab "Form" [disabled]
        - tab "JSON" [selected]
    - tabpanel "JSON":
        - text: Arguments
        - textbox "Arguments": "{}"
    - button "Run tool"
    - text: Runs for real on Verify MCP fixed; you'll be asked to confirm. Success 0 ms
    - tablist:
        - tab "Content" [selected]
        - tab "Raw"
    - tabpanel "Content": reset done
- region "Notifications alt+T"
