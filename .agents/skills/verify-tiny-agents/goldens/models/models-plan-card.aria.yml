            - paragraph: Experimental. Bots answer on your Claude Pro or Max subscription through Claude Code, which tiny-agents installs and runs on your sandbox. tiny-agents never sees the login.
            - paragraph: The engine is on. Bots on a “uses your Claude plan” model answer through Claude Code.
            - paragraph: No sandbox is configured. Set SANDBOX_HOST, or run pnpm sandbox:up for a local one.
            - paragraph: When the engine is off or Claude Code can't answer, turns pause.
            - paragraph: "Sign in opens a terminal tab running claude auth login: follow its link, then paste the code back into the tab. Never paste a Claude token into tiny-agents."
