# http://localhost:3320/chats/<id1>
- region "Notifications alt+T"
- dialog "Edit Improve Bot fixed":
    - heading "Edit Improve Bot fixed" [level=2]
    - paragraph: Prompt and model changes apply from the next turn; history is kept.
    - tablist:
        - tab "Profile" [selected]
        - tab "Tools"
        - tab "Skills"
        - tab "Sharing"
    - tabpanel "Profile":
        - text: Name
        - textbox "Name":
            - /placeholder: e.g. Research helper
            - text: Improve Bot fixed
        - text: Description
        - textbox "Description":
            - /placeholder: One line, shown under the name
        - text: Model
        - button "Test Model (faux)"
        - text: System prompt
        - textbox "System prompt":
            - /placeholder: Who is this bot? How should it reply?
            - text: "Base prompt fixed. Self-improvement e2e: append this line."
    - button "Delete bot"
    - button "Cancel"
    - button "Save changes"
    - button "Close"
