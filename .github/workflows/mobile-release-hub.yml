# Copied from groot-mobile-app (mobile/docs/guides/release-hub.md, "Monorepo children").
# Publishes the release APK to a release-hub server's direct channel,
# keyless: the job's GitHub Actions OIDC token is exchanged for a 1-hour release hub token
# scoped to one app — no secret stored in this repo. See mobile/docs/guides/release-hub.md.
#
# One-time setup:
#   1. Register the app on your release hub (UI: Apps → Register app; slug from vars.RELEASE_HUB_SLUG
#      below) and add its android platform — the release hub generates the signing keystore.
#   2. Add an OIDC grant (app → Configuration → Keyless publishing) for this repo's
#      subject. Repos created before 2026-07-15:
#        repo:OWNER/REPO:ref:refs/heads/main
#      newer repos use immutable subject claims — copy the prefix from the repo's
#      Settings → Actions → OIDC configuration and append the suffix:
#        repo:OWNER@OWNER-ID/REPO@REPO-ID:ref:refs/heads/main
#   3. Set repo variable vars.RELEASE_HUB_URL (e.g. https://release-hub.example.com).
#      Optionally vars.RELEASE_HUB_SLUG if it differs from the repo name lowercased.
#
# Then bump VERSION_CODE in mobile/android/version.properties (it only goes up; the release hub
# refuses a code it already has). Merging that to main publishes; the Actions tab can rerun it.
name: Mobile Release Hub Publish

on:
  # Every VERSION_CODE bump that lands on main publishes; the release hub refuses a code it
  # already has, so a change that keeps the code fails the run instead of publishing twice.
  push:
    branches: [main]
    paths:
      - mobile/android/version.properties
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes (shown as "What's new")
        default: ""

permissions:
  contents: read
  id-token: write # request the repo's OIDC token for the release hub exchange

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Build and publish
    # A version bump in a repo with no release hub set up skips quietly; a manual run still
    # fails fast on the missing variable.
    if: github.event_name == 'workflow_dispatch' || vars.RELEASE_HUB_URL != ''
    runs-on: instabox-medium
    timeout-minutes: 30
    env:
      RELEASE_HUB_URL: ${{ vars.RELEASE_HUB_URL }}
      RELEASE_HUB_SLUG: ${{ vars.RELEASE_HUB_SLUG || github.event.repository.name }}
      NOTES: ${{ inputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./mobile/.github/actions/setup-android

      - name: Exchange the job's OIDC token for a release hub token
        run: |
          set -euo pipefail
          : "${RELEASE_HUB_URL:?RELEASE_HUB_URL repo variable is not set (Settings → Secrets and variables → Actions → Variables)}"
          oidc=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            -H "Accept: application/json; api-version=2.0" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=release-hub" | jq -r .value)
          resp=$(curl -sS -X POST "$RELEASE_HUB_URL/api/oidc/exchange" \
            --data-urlencode "token=$oidc" -w '\n%{http_code}')
          code=$(tail -n1 <<<"$resp"); body=$(sed '$d' <<<"$resp")
          if [ "$code" != "200" ]; then
            echo "::error::release hub exchange failed (HTTP $code): $body — if the grant is missing or the subject differs, copy the subject from this message into the release hub's Keyless publishing grant."
            exit 1
          fi
          RELEASE_HUB_TOKEN=$(jq -r .token <<<"$body")
          echo "::add-mask::$RELEASE_HUB_TOKEN"
          echo "RELEASE_HUB_TOKEN=$RELEASE_HUB_TOKEN" >> "$GITHUB_ENV"

      - name: Fetch the signing key from the release hub
        run: |
          set -euo pipefail
          curl -fsS -D "$RUNNER_TEMP/h" -H "Authorization: Bearer $RELEASE_HUB_TOKEN" \
            -o "$RUNNER_TEMP/release.jks" "$RELEASE_HUB_URL/api/apps/$RELEASE_HUB_SLUG/android/signing"
          header() { grep -i "^$1:" "$RUNNER_TEMP/h" | cut -d' ' -f2- | tr -d '\r'; }
          echo "$(header x-release-hub-keystore-sha256)  $RUNNER_TEMP/release.jks" | sha256sum -c
          {
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEY_ALIAS=$(header x-release-hub-key-alias)"
          } >> "$GITHUB_ENV"
          echo "::add-mask::$(header x-release-hub-store-password)"
          echo "::add-mask::$(header x-release-hub-key-password)"
          echo "RELEASE_STORE_PASSWORD=$(header x-release-hub-store-password)" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$(header x-release-hub-key-password)" >> "$GITHUB_ENV"

      - name: Build the signed release APK
        working-directory: mobile/android
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Upload to the release hub's direct channel
        working-directory: mobile/android
        run: |
          set -euo pipefail
          . ./version.properties
          curl -fsS -H "Authorization: Bearer $RELEASE_HUB_TOKEN" \
            -F "file=@app/build/outputs/apk/release/app-release.apk" \
            -F channel=direct -F "versionCode=$VERSION_CODE" -F "versionName=$VERSION_NAME" -F "notes=$NOTES" \
            "$RELEASE_HUB_URL/api/apps/$RELEASE_HUB_SLUG/android/releases"
          rm -f "$RELEASE_STORE_FILE"
