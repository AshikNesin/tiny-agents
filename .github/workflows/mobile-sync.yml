# Pulls groot-mobile-app changes into mobile/ as a chore/groot-mobile-sync PR, twice a day.
# The boilerplate's own sync.yml, run from the app's folder (mobile/docs/guides/sync.md,
# "Apps inside a monorepo"). The web boilerplate's sync is groot-sync.yml; the two never
# touch each other's files, branches or baseline refs.
name: Groot Mobile Sync

on:
  schedule:
    - cron: "30 7 * * *" # 1 PM IST
    - cron: "30 19 * * *" # 1 AM IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: mobile
    steps:
      # The sync PR must trigger mobile.yml, which PRs opened with GITHUB_TOKEN never do.
      # Configure vars.GROOT_APP_ID + secrets.GROOT_APP_PRIVATE_KEY (a GitHub App installed on this repo).
      - name: App token
        id: app-token
        if: ${{ vars.GROOT_APP_ID != '' }}
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.GROOT_APP_ID }}
          private-key: ${{ secrets.GROOT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          package_json_file: mobile/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Check and apply clean changes
        id: sync
        run: |
          pnpm groot:check
          APPLICABLE=$(jq '((.autoApply // []) | length) + ((.autoMerged // []) | length) + ((.conflicts // []) | length) + ((.deleted // []) | length)' .groot/sync-report.json)
          if [ "$APPLICABLE" -gt 0 ]; then
            # Conflicts are recorded for `pnpm groot:resolve`, never written into the tree here.
            pnpm groot:sync --skip-conflicts
            echo "changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: PR body from the sync report
        if: steps.sync.outputs.changes == 'true'
        run: |
          jq -r '
            "## Groot Mobile sync\n",
            "Paths are relative to `mobile/`.\n",
            (if (.breakingChanges // []) | length > 0 then "### Breaking changes\n" + ((.breakingChanges | map("- " + .)) | join("\n")) + "\n" else empty end),
            "### Auto-applied (\((.autoApply // []) | length))", ((.autoApply // [])[] | "- `" + . + "`"), "",
            "### Merged (\((.autoMerged // []) | length))", ((.autoMerged // [])[] | "- `" + . + "`"), "",
            "### Conflicts: run `pnpm groot:resolve` in `mobile/` (\((.conflicts // []) | length))", ((.conflicts // [])[] | "- `" + (if type == "object" then .file else . end) + "`"), "",
            "### Drift: new upstream paths, not synced (\((.drift // []) | length))", ((.drift // [])[] | "- `" + . + "`")
          ' .groot/sync-report.json > /tmp/mobile-sync-pr-body.md

      - name: Open or update the sync PR
        if: steps.sync.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@98357b18bf14b5342f975ff684046ec3b2a07725 # v8.0.0
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          branch: chore/groot-mobile-sync
          add-paths: mobile
          title: "chore: sync mobile from groot-mobile-app"
          commit-message: "chore: sync mobile from groot-mobile-app"
          body-path: /tmp/mobile-sync-pr-body.md
          delete-branch: true
