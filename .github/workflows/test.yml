name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["main", "next"]

permissions:
  contents: read

concurrency:
  # Every push runs in a group of its own, because a shared group cancels a
  # pending run even without cancel-in-progress, and each commit pushed to main
  # needs its secret scan.
  group: tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: instabox-medium
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ripgrep
        # The instabox CI image, unlike ubuntu-latest, ships without ripgrep,
        # which scripts/check-design-tokens.ts shells out to.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - name: Secret scan (gitleaks)
        # The pre-commit hook skips gitleaks where it isn't installed.
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          bash scripts/secret-scan.sh "$RUNNER_TEMP/gitleaks" "$BASE"

      - name: Static gates (scripts/gates.mjs)
        run: pnpm verify:static

      - name: Server tests
        run: pnpm test
      - name: Client tests
        run: pnpm test:client

      - name: Build (client + Node server)
        run: pnpm build
      - name: Runtime dependency closure
        run: pnpm check:closure

      - name: Pruned production boot
        env:
          NODE_ENV: production
          JWT_SECRET_KEY: ci-boot-secret-key-0123456789abcdef0123456789
          ADMIN_AUTH_KEY: ci-admin-key
          RP_ID: localhost
          ORIGIN: http://localhost:3999
        run: |
          set -euo pipefail
          rm -rf ../pruned-boot && mkdir -p ../pruned-boot
          tar cf - $(git ls-files) dist | tar xf - -C ../pruned-boot
          cd ../pruned-boot
          pnpm install --frozen-lockfile --prod --ignore-scripts
          pnpm rebuild
          DATABASE_URL=file:./tmp/boot.db AGENT_DB_PATH=./tmp/agent.db PORT=3999 \
            node dist/server/bundle.js > boot.log 2>&1 < /dev/null &
          server_pid=$!
          for i in $(seq 1 60); do
            if curl -fsS -m 5 http://localhost:3999/health; then
              echo "health endpoint answered"
              curl -fsS -m 5 http://localhost:3999/ | grep -q '<div id="root">' && echo "client served"
              kill -TERM "$server_pid"
              for j in $(seq 1 15); do
                kill -0 "$server_pid" 2>/dev/null || exit 0
                sleep 1
              done
              echo "server still up after 15s of TERM"
              exit 1
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "server exited before answering /health"
              cat boot.log
              exit 1
            fi
            sleep 1
          done
          echo "server did not answer /health within 60s"
          cat boot.log
          exit 1
