# The local sandbox: a container standing in for the Tailscale sandbox VM.
# Start it with `pnpm sandbox:up` (creates the SSH key, then runs this file);
# see docs/guides/local-sandbox.md.
name: tiny-agents-sandbox

services:
  sandbox:
    build:
      context: .
      args:
        EXTRA_PACKAGES: ${SANDBOX_EXTRA_PACKAGES:-}
        SHELLEY_VERSION: ${SANDBOX_SHELLEY_VERSION:-latest}
        CODEX_VERSION: ${SANDBOX_CODEX_VERSION:-latest}
    # Built for the host's architecture: amd64 gets Google Chrome, arm64
    # (Apple Silicon) Debian's Chromium, both natively.
    image: tiny-agents-sandbox:local
    hostname: tiny-agents-sandbox
    restart: unless-stopped
    ports:
      # Loopback only: nothing off this computer can reach the sandbox.
      - "127.0.0.1:${SANDBOX_LOCAL_PORT:-2222}:22"
      # Shelley's web UI (it has no login of its own): loopback only too.
      - "127.0.0.1:${SANDBOX_SHELLEY_PORT:-9000}:9000"
    environment:
      # SANDBOX_SHELLEY=0 stops Shelley from starting. The keys are optional
      # (providers can be added in Shelley's UI) and reach only Shelley.
      SANDBOX_SHELLEY: ${SANDBOX_SHELLEY:-1}
      # SANDBOX_CLIS=0 skips the start-up check that installs gh and codex
      # when the image lacks them.
      SANDBOX_CLIS: ${SANDBOX_CLIS:-1}
      SANDBOX_CODEX_VERSION: ${SANDBOX_CODEX_VERSION:-latest}
      SHELLEY_ANTHROPIC_API_KEY: ${SHELLEY_ANTHROPIC_API_KEY:-}
      SHELLEY_OPENAI_API_KEY: ${SHELLEY_OPENAI_API_KEY:-}
      SHELLEY_GEMINI_API_KEY: ${SHELLEY_GEMINI_API_KEY:-}
      SHELLEY_FIREWORKS_API_KEY: ${SHELLEY_FIREWORKS_API_KEY:-}
    # Chrome and the XFCE desktops need more than Docker's 64 MB /dev/shm.
    shm_size: 2gb
    volumes:
      - type: bind
        source: ../../data/sandbox/id_ed25519.pub
        target: /etc/tiny-agents/authorized_keys
        read_only: true
        bind:
          create_host_path: false
      - home:/home/exedev
      - host-keys:/etc/ssh/host-keys

volumes:
  # Bots' files, browser profiles and desktops; survives rebuilds.
  home:
  # sshd's host key, so the app's pinned key stays valid.
  host-keys:
