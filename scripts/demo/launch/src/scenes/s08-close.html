<div class="f-scene">
  <div class="vp">
    <div class="cam">
      <div class="appwin" data-snap="desktop/side-end" data-fix="unread:Expense Tracker"></div>
    </div>
  </div>
  <p class="cap c1">They work. You stay in charge.</p>

  <div class="end">
    <div class="end-row">
      <div class="end-mark">
        <!-- The mark from apps/web/public/favicon.svg, without its tile. -->
        <svg viewBox="8 8 48 48" aria-hidden="true">
          <path
            fill="#fcfcfc"
            d="M23 14h16a12 12 0 0 1 12 12v6a12 12 0 0 1-12 12H29l-11 8v-9.09A12 12 0 0 1 11 32v-6a12 12 0 0 1 12-12z"
          />
          <rect x="24" y="22" width="6" height="12" rx="3" fill="#0c0b0a" />
          <rect x="36" y="22" width="6" height="12" rx="3" fill="#0c0b0a" />
          <circle
            class="end-dot"
            cx="49.5"
            cy="15.5"
            r="5.5"
            fill="#fcfcfc"
            stroke="#0c0b0a"
            stroke-width="3.5"
          />
        </svg>
      </div>
      <div class="end-name">Tiny Agents</div>
    </div>
    <p class="end-tag">Your team of always-on AI agents.</p>
    <div class="end-cta-row">
      <div class="end-cta">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            class="end-star"
            d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z"
            fill="none"
            stroke="#0c0b0a"
            stroke-width="1.9"
            stroke-linejoin="round"
          />
        </svg>
        <span>Star on GitHub</span>
      </div>
    </div>
    <p class="end-url">github.com/AshikNesin/tiny-agents</p>
  </div>

  <div class="cursor">
    <svg viewBox="0 0 26 26">
      <path
        d="M5 2.5 L5 20.5 L9.6 16.4 L12.7 23.2 L15.9 21.8 L12.9 15.1 L19.2 15.1 Z"
        fill="#111"
        stroke="#fff"
        stroke-width="1.5"
        stroke-linejoin="round"
      />
    </svg>
  </div>
</div>
<script>
  Film.scene("{{id}}", {{dur}}, (S) => {
    const { tl } = S;
    const cam = S.camera(".cam");
    const bots = S.q('.appwin section[aria-label="Bots"]') || S.q(".appwin .appbody");
    const logo = S.q('.appwin a[aria-label="tiny-agents"]') || S.q(".appwin .appbody");
    const row = (name) => S.qa('.appwin section[aria-label="Bots"] li').find((li) => li.textContent.includes(name));

    // The bot list, as the film opened on it. Nothing is waiting now.
    const vp = S.q(".vp");
    const panel = S.listPanel(cam, S.q('.appwin aside[aria-label="Sidebar"]'), bots);
    const inbox = panel.cam;
    gsap.set(vp, panel.vp);
    cam.set(inbox);
    const dot = row("Expense Tracker")?.querySelector('[aria-label="Unread"]');
    if (dot) tl.to(dot, { scale: 0, opacity: 0, duration: 0.25, ease: "power2.in" }, 0.8);
    S.cap(".c1", 0.4, 3.9);

    // Up to the mark at the top of the sidebar, and a click on it.
    const top = { ...inbox, y: 0 };
    cam.to(2.9, top, 0.7);
    const cur = S.cursor();
    const l0 = cam.local(logo);
    const pLogo = {
      x: (S.FRAME.w - 760) / 2 + (l0.x + l0.w / 2) * top.scale,
      y: cam.vp.y + (l0.y + l0.h / 2) * top.scale,
    };
    cur.enter(3.4, { x: pLogo.x + 560, y: pLogo.y + 430 }, pLogo, 0.75);
    cur.click(4.2);

    // The click floods the frame, and the mark lifts out of the sidebar to the centre.
    const end = S.q(".end");
    const mark = S.q(".end-mark");
    const m = S.rect(mark);
    const l = S.rect(logo);
    const k = (l.w * 0.62) / m.w;
    tl.fromTo(
      end,
      { clipPath: `circle(0px at ${pLogo.x}px ${pLogo.y}px)` },
      { clipPath: `circle(2400px at ${pLogo.x}px ${pLogo.y}px)`, duration: 0.6, ease: "power2.in" },
      4.26,
    );
    tl.fromTo(
      mark,
      { x: pLogo.x - (m.x + m.w / 2), y: pLogo.y - (m.y + m.h / 2), scale: k },
      { x: 0, y: 0, scale: 1, duration: 0.72, ease: "expo.inOut" },
      4.28,
    );
    S.sfx(4.26, "whoosh", { d: 0.6 });
    S.sfx(5.0, "section:end");
    cur.hide(4.3, 0.12);
    tl.fromTo(
      S.q(".end-dot"),
      { scale: 0, transformOrigin: "50% 50%" },
      { scale: 1, duration: 0.3, ease: "back.out(2.2)" },
      5.02,
    );
    tl.fromTo(
      S.q(".end-name"),
      { clipPath: "inset(0% 100% 0% 0%)", x: -18 },
      { clipPath: "inset(-10% -2% -10% 0%)", x: 0, duration: 0.5, ease: "power3.out" },
      5.12,
    );
    S.cap(".end-tag", 5.75);
    S.show(6.5, ".end-cta", { y: 14, d: 0.4 });
    S.show(6.72, ".end-url", { y: 0, d: 0.4 });

    // A click on the call to action; then it holds.
    const cta = S.rect(".end-cta");
    const pCta = { x: cta.x + cta.w * 0.62, y: cta.y + cta.h * 0.6 };
    tl.set(cur.el, { x: pCta.x + 380, y: pCta.y + 300 }, 6.8);
    tl.to(cur.el, { opacity: 1, duration: 0.12 }, 6.82);
    cur.to(6.82, pCta, 0.62, "power3.out");
    cur.click(7.55);
    S.press(7.55, ".end-cta");
    tl.to(S.q(".end-star"), { fill: "#e3a008", stroke: "#e3a008", duration: 0.16 }, 7.62);
    tl.fromTo(
      S.q(".end-cta svg"),
      { scale: 1 },
      { scale: 1.22, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false },
      7.62,
    );
  });
</script>
