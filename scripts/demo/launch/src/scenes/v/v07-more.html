<!-- scene: dur=6 -->
<style></style>
<div class="f-scene">
  <div class="vp shot s1">
    <div class="cam"><div class="appwin m" data-snap="mobile/memory"></div></div>
  </div>
  <div class="vp shot s2">
    <div class="cam"><div class="appwin m" data-snap="mobile/terminal"></div></div>
  </div>
  <div class="vp shot s3">
    <div class="cam"><div class="appwin m" data-snap="mobile/models"></div></div>
  </div>
  <div class="vp shot s4">
    <div class="cam"><div class="appwin m" data-snap="mobile/updates"></div></div>
  </div>
  <p class="eyebrow m-eyebrow">And more</p>
  <p class="cap l1">Remembers you</p>
  <p class="cap l2">A real terminal</p>
  <p class="cap l3">Any model</p>
  <p class="cap l4">Updates itself</p>
  <div class="tap"></div>
</div>
<script>
  Film.scene("{{id}}", {{dur}}, (S) => {
    const { tl } = S;
    const CUT = [0, 1.5, 3.0, 4.5, 6.0];
    const shots = S.qa(".shot");
    /** The innermost element matching `sel` that holds `text`. */
    const has = (root, sel, text) =>
      [...root.querySelectorAll(sel)].filter((el) => el.textContent.includes(text)).pop();
    const union = (...r) => {
      const x = Math.min(...r.map((a) => a.x));
      const y = Math.min(...r.map((a) => a.y));
      return { x, y, w: Math.max(...r.map((a) => a.x + a.w)) - x, h: Math.max(...r.map((a) => a.y + a.h)) - y };
    };
    tl.fromTo(".m-eyebrow", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.02);

    /** One shot: cut in a little wide of the control, settle on it, and let the control do something. */
    const shot = (i, target, opts, act) => {
      const el = shots[i];
      const cam = S.camera(el.querySelector(".cam"));
      const box = typeof target === "function" ? target(cam) : cam.local(target);
      const to = cam.frame(box, opts);
      const from = cam.frame(box, { ...opts, scale: to.scale * 0.93, fit: undefined });
      cam.set(from);
      const t = CUT[i];
      if (i > 0) {
        gsap.set(el, { autoAlpha: 0 });
        tl.set(el, { autoAlpha: 1 }, t);
        tl.set(shots[i - 1], { autoAlpha: 0 }, t);
        S.sfx(t, "cut");
      }
      cam.to(t, to, 0.7, "expo.out");
      S.cap(`.l${i + 1}`, t + 0.04, CUT[i + 1] - 0.02);
      if (act) act(el, t, cam);
    };

    // Memory: what the bots learned about you.
    const prefs = has(shots[0], '[data-slot="card"]', "Prefers window seats");
    shot(0, prefs, { fit: 0.98, ay: 0.5 }, (el, t) => {
      const facts = [...prefs.querySelectorAll("li")];
      S.show(t + 0.08, facts.length ? facts : [...prefs.children], { y: 8, stagger: 0.14 });
    });

    // The sandbox's own shell, after the test run.
    const rows = [...shots[1].querySelectorAll(".xterm-rows > div")].filter((r) => r.textContent.trim());
    const runAt = rows.findIndex((r) => r.textContent.includes("✓"));
    const tail = rows.findIndex((r) => r.textContent.includes("48 passed"));
    shot(1, (cam) => union(cam.local(rows[runAt]), cam.local(rows[tail])), { fit: 0.97, ay: 0.5 }, (el, t) => {
      S.show(t + 0.1, rows.slice(runAt, tail + 1), { y: 0, d: 0.08, stagger: 0.05 });
      S.sfx(t + 0.6, "tick");
    });

    // Every provider account, each with its models.
    const anth = has(shots[2], '[data-slot="card"]', "Claude Opus 5.5");
    const models = [...anth.querySelectorAll("li")];
    const anthTitle = anth.querySelector('[data-slot="card-title"]') || anth;
    shot(2, (cam) => union(cam.local(anthTitle), ...models.map(cam.local)), { fit: 0.98, ay: 0.5 }, (el, t) =>
      S.show(t + 0.2, models, { y: 8, stagger: 0.16 }),
    );

    // Updates, one tap away.
    const card = has(shots[3], '[data-slot="card"]', "Update & restart");
    const btn = has(card, "button", "Update & restart");
    const avail = has(card, "div", "Available") || card;
    shot(3, (cam) => union(cam.local(card.firstElementChild), cam.local(btn)), { fit: 0.98, ay: 0.5 }, (el, t, cam) => {
      const p = cam.point(btn, t + 0.7);
      tl.set(S.q(".tap"), { x: p.x, y: p.y }, t + 0.73);
      S.tap(".tap", t + 0.9, p);
      S.press(t + 0.9, btn);
      void avail;
    });
  });
</script>
