<div class="f-scene">
  <div class="vp">
    <div class="cam">
      <div class="appwin m" data-snap="mobile/list-end"></div>
    </div>
  </div>
  <p class="cap c1">They work.<br />You stay in charge.</p>

  <div class="end">
    <div class="end-row">
      <div class="end-mark">
        <!-- The mark from apps/web/public/favicon.svg, without its tile. -->
        <svg viewBox="8 8 48 48" aria-hidden="true">
          <path
            fill="#fcfcfc"
            d="M23 14h16a12 12 0 0 1 12 12v6a12 12 0 0 1-12 12H29l-11 8v-9.09A12 12 0 0 1 11 32v-6a12 12 0 0 1 12-12z"
          />
          <rect x="24" y="22" width="6" height="12" rx="3" fill="#0c0b0a" />
          <rect x="36" y="22" width="6" height="12" rx="3" fill="#0c0b0a" />
          <circle
            class="end-dot"
            cx="49.5"
            cy="15.5"
            r="5.5"
            fill="#fcfcfc"
            stroke="#0c0b0a"
            stroke-width="3.5"
          />
        </svg>
      </div>
      <div class="end-name">Tiny Agents</div>
    </div>
    <p class="end-tag">Your team of always-on AI agents.</p>
    <div class="end-cta-row">
      <div class="end-cta">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            class="end-star"
            d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z"
            fill="none"
            stroke="#0c0b0a"
            stroke-width="1.9"
            stroke-linejoin="round"
          />
        </svg>
        <span>Star on GitHub</span>
      </div>
    </div>
    <p class="end-url">github.com/AshikNesin/tiny-agents</p>
  </div>

  <div class="tap"></div>
</div>
<script>
  Film.scene("{{id}}", {{dur}}, (S) => {
    const { tl } = S;
    const cam = S.camera(".cam");
    const bots = S.q('.appwin main section[aria-label="Bots"]');
    const menu = S.q(".appwin main button");

    // The bot list, framed as the film opened on it. Five bots now, nothing waiting.
    const close = cam.frame(bots, { fit: 1.0, ay: 0.52 });
    const full = cam.full();
    cam.set(close);
    S.cap(".c1", 0.08, 2.25);
    cam.to(1.3, full, 0.7, "power2.inOut");

    // A tap on the menu, where the app keeps its mark: the frame floods and the mark lifts to the centre.
    const TAP = 2.2;
    const pMenu = cam.point(menu, TAP);
    const mw = cam.local(menu).w * full.scale;
    tl.set(S.q(".tap"), { x: pMenu.x, y: pMenu.y }, TAP - 0.17);
    S.tap(".tap", TAP, pMenu);

    const end = S.q(".end");
    const mark = S.q(".end-mark");
    const m = S.rect(mark);
    const k = (mw * 0.7) / m.w;
    tl.fromTo(
      end,
      { clipPath: `circle(0px at ${pMenu.x}px ${pMenu.y}px)` },
      { clipPath: `circle(2400px at ${pMenu.x}px ${pMenu.y}px)`, duration: 0.6, ease: "power2.in" },
      2.26,
    );
    // The mark lands at exactly 3.0 s, on the score's resolving chord.
    tl.fromTo(
      mark,
      { x: pMenu.x - (m.x + m.w / 2), y: pMenu.y - (m.y + m.h / 2), scale: k },
      { x: 0, y: 0, scale: 1, duration: 0.72, ease: "expo.inOut" },
      2.28,
    );
    S.sfx(2.26, "whoosh", { d: 0.6 });
    S.sfx(3.0, "section:end");
    tl.fromTo(
      S.q(".end-dot"),
      { scale: 0, transformOrigin: "50% 50%" },
      { scale: 1, duration: 0.3, ease: "back.out(2.2)" },
      3.02,
    );
    tl.fromTo(
      S.q(".end-name"),
      { clipPath: "inset(0% 100% 0% 0%)", x: -18 },
      { clipPath: "inset(-10% -2% -10% 0%)", x: 0, duration: 0.5, ease: "power3.out" },
      3.08,
    );
    S.cap(".end-tag", 3.3);
    S.show(3.55, ".end-cta", { y: 14, d: 0.4 });
    S.show(3.65, ".end-url", { y: 0, d: 0.35 });
    // Everything has landed by 4.0 s: the last frame holds for 2 s.
  });
</script>
