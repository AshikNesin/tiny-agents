<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>tiny-agents demo stage</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0b10;
      }
      /* Designed at 1600x900, rendered at 1920x1080 (static transforms re-raster crisp). */
      #root {
        position: absolute;
        left: 0;
        top: 0;
        width: 1600px;
        height: 900px;
        overflow: hidden;
        transform: scale(1.2);
        transform-origin: 0 0;
        font-family: "Inter", system-ui, sans-serif;
        color: #f4f4f5;
        background:
          radial-gradient(900px 600px at 12% 8%, rgba(99, 102, 241, 0.3), transparent 60%),
          radial-gradient(800px 600px at 92% 95%, rgba(20, 184, 166, 0.22), transparent 60%),
          radial-gradient(700px 500px at 80% 0%, rgba(236, 72, 153, 0.14), transparent 60%), #0b0b10;
        -webkit-font-smoothing: antialiased;
      }
      #caption {
        position: absolute;
        top: 26px;
        left: 0;
        right: 0;
        z-index: 5;
        text-align: center;
        transition:
          opacity 450ms ease,
          transform 450ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      #caption.hidden {
        opacity: 0;
        transform: translateY(-8px);
      }
      #eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 12.5px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(244, 244, 245, 0.62);
      }
      #eyebrow::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 99px;
        background: linear-gradient(135deg, #818cf8, #2dd4bf);
        box-shadow: 0 0 12px rgba(129, 140, 248, 0.8);
      }
      #headline {
        margin-top: 8px;
        font-size: 33px;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      #window {
        position: absolute;
        left: 160px;
        top: 118px;
        width: 1280px;
        height: 752px;
        z-index: 2;
        border-radius: 14px;
        overflow: hidden;
        background: #161616;
        box-shadow:
          0 50px 120px rgba(0, 0, 0, 0.6),
          0 0 0 1px rgba(255, 255, 255, 0.09);
        transform-origin: 50% 50%;
        transition:
          transform 1100ms cubic-bezier(0.22, 1, 0.36, 1),
          left 900ms cubic-bezier(0.22, 1, 0.36, 1),
          width 900ms cubic-bezier(0.22, 1, 0.36, 1),
          height 900ms cubic-bezier(0.22, 1, 0.36, 1),
          top 900ms cubic-bezier(0.22, 1, 0.36, 1),
          border-radius 900ms ease;
      }
      #bar {
        height: 32px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 14px;
        background: #1c1c1f;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        position: relative;
        transition:
          height 700ms ease,
          opacity 500ms ease;
      }
      #bar i {
        width: 12px;
        height: 12px;
        border-radius: 99px;
        display: block;
      }
      #bar .url {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        font-size: 12px;
        color: rgba(255, 255, 255, 0.45);
        display: flex;
        gap: 6px;
        align-items: center;
      }
      #app {
        width: 1280px;
        height: 720px;
        border: 0;
        display: block;
        background: #161616;
        transition:
          width 900ms cubic-bezier(0.22, 1, 0.36, 1),
          height 900ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      body.light #bar {
        background: #ececee;
        border-bottom-color: rgba(0, 0, 0, 0.06);
      }
      body.light #bar .url {
        color: rgba(0, 0, 0, 0.45);
      }
      body.phone #window {
        left: 612px;
        width: 376px;
        height: 760px;
        top: 112px;
        border-radius: 44px;
        box-shadow:
          0 50px 120px rgba(0, 0, 0, 0.6),
          0 0 0 10px #050506,
          0 0 0 11px rgba(255, 255, 255, 0.14);
      }
      body.phone #bar {
        height: 0;
        opacity: 0;
      }
      body.phone #app {
        width: 376px;
        height: 760px;
      }
      #cursor {
        position: absolute;
        left: 0;
        top: 0;
        z-index: 20;
        width: 26px;
        height: 26px;
        pointer-events: none;
        transform: translate(1500px, 860px);
        filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.45));
        transition: opacity 300ms ease;
      }
      .ripple {
        position: absolute;
        z-index: 19;
        width: 44px;
        height: 44px;
        margin: -22px 0 0 -22px;
        border-radius: 99px;
        pointer-events: none;
        border: 2px solid rgba(129, 140, 248, 0.9);
        background: rgba(129, 140, 248, 0.18);
        animation: ripple 520ms ease-out forwards;
      }
      @keyframes ripple {
        from {
          transform: scale(0.3);
          opacity: 1;
        }
        to {
          transform: scale(1.25);
          opacity: 0;
        }
      }
      #toast {
        position: absolute;
        z-index: 6;
        left: 50%;
        top: 92px;
        transform: translate(-50%, -6px);
        padding: 7px 14px;
        border-radius: 99px;
        font-size: 13.5px;
        font-weight: 550;
        background: rgba(129, 140, 248, 0.18);
        border: 1px solid rgba(129, 140, 248, 0.45);
        color: #e0e7ff;
        opacity: 0;
        transition:
          opacity 300ms ease,
          transform 300ms ease;
      }
      #toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      #card {
        position: absolute;
        inset: 0;
        z-index: 30;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: inherit;
        transition: opacity 900ms ease;
      }
      #card.gone {
        opacity: 0;
        pointer-events: none;
      }
      #card .logo {
        width: 104px;
        height: 104px;
        border-radius: 26px;
        box-shadow:
          0 30px 80px rgba(129, 140, 248, 0.35),
          0 0 0 1px rgba(255, 255, 255, 0.12);
        opacity: 0;
        transform: scale(0.7);
        transition: all 900ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      #card .name {
        font-size: 64px;
        font-weight: 700;
        letter-spacing: -0.04em;
        opacity: 0;
        transform: translateY(14px);
        transition: all 900ms cubic-bezier(0.22, 1, 0.36, 1) 180ms;
      }
      #card .tag {
        font-size: 24px;
        color: rgba(244, 244, 245, 0.72);
        font-weight: 450;
        opacity: 0;
        transform: translateY(14px);
        transition: all 900ms cubic-bezier(0.22, 1, 0.36, 1) 360ms;
      }
      #card .pills {
        display: flex;
        gap: 10px;
        margin-top: 8px;
        opacity: 0;
        transform: translateY(14px);
        transition: all 900ms cubic-bezier(0.22, 1, 0.36, 1) 540ms;
      }
      #card .pills span {
        padding: 8px 14px;
        border-radius: 99px;
        font-size: 14px;
        font-weight: 550;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: rgba(244, 244, 245, 0.85);
      }
      #card.in .logo {
        opacity: 1;
        transform: none;
      }
      #card.in .name,
      #card.in .tag,
      #card.in .pills {
        opacity: 1;
        transform: none;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="caption" class="hidden">
        <div id="eyebrow"></div>
        <div id="headline"></div>
      </div>
      <div id="toast"></div>
      <div id="window">
        <div id="bar">
          <i style="background: #ff5f57"></i><i style="background: #febc2e"></i
          ><i style="background: #28c840"></i>
          <span class="url">🔒 tiny-agents</span>
        </div>
        <iframe id="app"></iframe>
      </div>
      <svg id="cursor" viewBox="0 0 26 26">
        <path
          d="M5 2.5 L5 20.5 L9.6 16.4 L12.7 23.2 L15.9 21.8 L12.9 15.1 L19.2 15.1 Z"
          fill="#fff"
          stroke="#111"
          stroke-width="1.6"
          stroke-linejoin="round"
        />
      </svg>
      <div id="card">
        <img class="logo" src="/favicon.svg" />
        <div class="name">tiny-agents</div>
        <div class="tag" id="cardTag">Your team of always-on AI bots</div>
        <div class="pills" id="cardPills"></div>
      </div>
    </div>
    <script>
      const $ = (id) => document.getElementById(id);
      const S = 1.2; // page px per design px
      window.stage = {
        cursor(x, y) {
          $("cursor").style.transform = `translate(${x / S - 5}px, ${y / S - 2.5}px)`;
        },
        cursorVisible(on) {
          $("cursor").style.opacity = on ? "1" : "0";
        },
        ripple(x, y) {
          const r = document.createElement("div");
          r.className = "ripple";
          r.style.left = `${x / S}px`;
          r.style.top = `${y / S}px`;
          $("root").appendChild(r);
          setTimeout(() => r.remove(), 600);
        },
        caption(eyebrow, headline) {
          const c = $("caption");
          if (!headline) {
            c.classList.add("hidden");
            return;
          }
          const swap = () => {
            $("eyebrow").textContent = eyebrow;
            $("headline").textContent = headline;
            c.classList.remove("hidden");
          };
          if (c.classList.contains("hidden")) swap();
          else {
            c.classList.add("hidden");
            setTimeout(swap, 420);
          }
        },
        toast(text) {
          const t = $("toast");
          t.textContent = text;
          t.classList.add("show");
          setTimeout(() => t.classList.remove("show"), 2200);
        },
        zoom(x, y, scale) {
          const w = $("window");
          const r = w.getBoundingClientRect();
          if (scale !== 1) w.style.transformOrigin = `${(x - r.left) / S}px ${(y - r.top) / S}px`;
          w.style.transform = scale === 1 ? "none" : `scale(${scale})`;
        },
        cardIn(tag, pills) {
          if (tag) $("cardTag").textContent = tag;
          $("cardPills").innerHTML = (pills || []).map((p) => `<span>${p}</span>`).join("");
          $("card").classList.remove("gone");
          requestAnimationFrame(() => $("card").classList.add("in"));
        },
        cardOut() {
          $("card").classList.add("gone");
          setTimeout(() => $("card").classList.remove("in"), 900);
        },
        light(on) {
          document.body.classList.toggle("light", on);
        },
        phone(on) {
          document.body.classList.toggle("phone", on);
        },
      };
    </script>
  </body>
</html>
